
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F7F4EE">

    <title>Verify your email — Foundev</title>

    <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/auth.js" defer></script>
</head>
<body class="auth-page">

    <header class="auth-header">
        <a href="../index.html" class="auth-brand" aria-label="Foundev home">
            <img src="../assets/images/foundev-logo.png" alt="Foundev">
        </a>
        <p>Already verified? <a href="login.html">Log in</a></p>
    </header>

    <main class="verification-layout">

        <section class="auth-card verification-card">

            <a href="signup.html" class="back-link">← Back to signup</a>

            <div class="verification-icon" aria-hidden="true">✉</div>

            <span class="auth-eyebrow">ONE LAST STEP</span>

            <h1>Check your inbox.</h1>

            <p class="verification-description">
                We've requested a verification code for
                <strong id="verification-email">your email address</strong>.
                Enter the six-digit code to verify your account.
            </p>

            <form id="otp-form" class="auth-form"
                  action="../backend/auth/verify-otp.php" method="post">

                <input type="hidden" name="email" id="otp-email">

                <div class="form-field">
                    <label for="otp-code">Verification code</label>
                    <input
                        id="otp-code"
                        name="otp"
                        type="text"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        pattern="[0-9]{6}"
                        minlength="6"
                        maxlength="6"
                        placeholder="000000"
                        aria-describedby="otp-hint"
                        required
                    >
                    <p class="field-hint" id="otp-hint">
                        Enter the six-digit code from your email.
                    </p>
                </div>

                <button type="submit" class="auth-submit">
                    Verify email <span aria-hidden="true">↗</span>
                </button>

                <p class="form-message" id="otp-message"
                   role="status" aria-live="polite"></p>
            </form>

            <div class="resend-section">
                <p>Didn't receive the code?</p>

                <button type="button" id="resend-otp"
                        class="text-button">
                    Resend verification code
                </button>

                <p class="field-hint" id="resend-message"
                   role="status" aria-live="polite"></p>
            </div>

        </section>

    </main>

    <footer class="auth-footer">
        <span>© <span data-current-year>2026</span> Foundev</span>
        <span>Learn. Build. Launch.</span>
    </footer>

</body>
</html>
