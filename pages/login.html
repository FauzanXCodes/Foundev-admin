
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F7F4EE">

    <title>Log in — Foundev</title>

    <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/auth.js" defer></script>
</head>
<body class="auth-page">

    <header class="auth-header">
        <a href="../index.html" class="auth-brand" aria-label="Foundev home">
            <img src="../assets/images/foundev-logo.png" alt="Foundev">
        </a>
        <p>New to Foundev? <a href="signup.html">Create an account</a></p>
    </header>

    <main class="verification-layout">

        <section class="auth-card login-card">

            <span class="auth-eyebrow">WELCOME BACK</span>
            <h1>Good to have you back.</h1>
            <p class="login-description">
                Pick up where you left off. Your next project is waiting.
            </p>

            <div class="social-auth">
                <a class="social-button" href="../backend/auth/google-login.php">
                    <span class="google-letter" aria-hidden="true">G</span>
                    <span>Continue with Google</span>
                    <span class="social-arrow" aria-hidden="true">↗</span>
                </a>

                <a class="social-button" href="../backend/auth/github-login.php">
                    <svg viewBox="0 0 24 24" aria-hidden="true" class="github-icon">
                        <path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.53v-2.06c-3.1.67-3.75-1.32-3.75-1.32-.5-1.28-1.24-1.62-1.24-1.62-1.02-.7.08-.69.08-.69 1.13.08 1.73 1.16 1.73 1.16 1 .1.77 2.07 3.28 1.45.1-.73.39-1.22.71-1.5-2.48-.28-5.08-1.24-5.08-5.52 0-1.22.44-2.22 1.16-3-.12-.28-.5-1.42.11-2.96 0 0 .95-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.1-1.45 3.04-1.15 3.04-1.15.61 1.54.23 2.68.12 2.96.72.78 1.15 1.78 1.15 3 0 4.29-2.6 5.23-5.09 5.51.4.35.76 1.03.76 2.08V22c0 .29.2.63.77.52A11.1 11.1 0 0 0 12 .9Z"/>
                    </svg>
                    <span>Continue with GitHub</span>
                    <span class="social-arrow" aria-hidden="true">↗</span>
                </a>
            </div>

            <div class="auth-divider">
                <span></span>
                <p>OR USE YOUR EMAIL</p>
                <span></span>
            </div>

            <form id="login-form" class="auth-form"
                  action="../backend/auth/login.php" method="post">

                <div class="form-field">
                    <label for="login-email">Email address</label>
                    <input id="login-email" name="email" type="email"
                           autocomplete="email" placeholder="you@example.com"
                           required>
                </div>

                <div class="form-field">
                    <div class="label-row">
                        <label for="login-password">Password</label>
                        <a href="forgot-password.html">Forgot password?</a>
                    </div>

                    <div class="password-wrap">
                        <input id="login-password" name="password"
                               type="password" autocomplete="current-password"
                               placeholder="Your password" required>

                        <button type="button" class="password-toggle"
                                data-password-toggle="login-password"
                                aria-label="Show password">Show</button>
                    </div>
                </div>

                <button type="submit" class="auth-submit">
                    Log in <span aria-hidden="true">↗</span>
                </button>

                <p class="form-message" id="login-message"
                   role="status" aria-live="polite"></p>
            </form>

        </section>

    </main>

    <footer class="auth-footer">
        <span>© <span data-current-year>2026</span> Foundev</span>
        <span>Learn. Build. Launch.</span>
    </footer>

</body>
</html>
